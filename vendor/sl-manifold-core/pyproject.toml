[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sl-manifold-core"
version = "0.1.0"
description = "Shared differentiable SL(n) geometry for cross-modal representation learning"
requires-python = ">=3.9"
dependencies = ["torch>=2.2,<3"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
